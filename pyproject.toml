[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tankx-research"
version = "0.1.0"
description = "End-to-end Binance backtester, microstructure feature lab, L2 order-book replay, and Avellaneda-Stoikov market-making simulator with walk-forward statistical evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Taylan Irak" },
]
keywords = ["crypto", "backtesting", "market-microstructure", "market-making", "binance", "quantitative-finance"]

dependencies = [
    "ccxt>=4.4,<5.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=15.0",
    "scipy>=1.11,<2.0",
    "plotly>=5.18,<6.0",
    "streamlit>=1.30,<2.0",
    "requests>=2.31,<3.0",
    "tqdm>=4.65,<5.0",
    "sortedcontainers>=2.4,<3.0",
    "python-dateutil>=2.9",
    "tabulate>=0.9",
    "scikit-learn>=1.4,<2.0",
    "torch>=2.2,<3.0",
    "xgboost>=2.0,<4.0",
    "lightgbm>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "types-requests",
    "types-tqdm",
]

[project.urls]
Homepage = "https://github.com/tankx-research"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tankx = ["py.typed"]

# ---------------- Ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # flake8-bugbear
    "UP",           # pyupgrade
    "N",            # pep8-naming
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
    "C4",           # comprehensions
    "PIE",          # misc
    "PT",           # pytest
    "RET",          # return statements
    "TCH",          # type-checking imports
]
ignore = [
    "E501",         # line too long (handled by formatter where applicable)
    "B008",         # function calls in default args (we use this for dataclass defaults)
    "N803",         # arg name lowercase (we use T, N for math/stats variables)
    "N806",         # var name lowercase (we use T, N etc. for math/stats variables)
    "TC001",        # type-checking import block: noisy, marginal benefit
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "PT011", "B017"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------- Mypy ----------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tankx"]
plugins = []
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["ccxt.*", "plotly.*", "streamlit.*", "sortedcontainers.*", "tqdm.*"]
ignore_missing_imports = true

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pandas.*",
    "ignore::DeprecationWarning:dateutil.*",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::sklearn.exceptions.ConvergenceWarning",
    "ignore::UserWarning:sklearn.*",
    "ignore::UserWarning:lightgbm.*",
    "ignore::UserWarning:xgboost.*",
]

[tool.coverage.run]
source = ["src/tankx"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
show_missing = true
skip_covered = false
